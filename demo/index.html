<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DiagCore 1.0.0 - Démonstration DHCP</title>
<link rel="stylesheet" href="../v1/diagcore.css">
<style>
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#edf2f6;color:#233442}main{max-width:1080px;margin:24px auto;padding:0 16px}h1{margin-bottom:6px}.intro{margin:0 0 18px} .layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(250px,1fr);gap:16px;align-items:start}.panel{background:#fff;border:1px solid #cbd3d9;border-radius:9px;padding:16px}.panel button{display:block;width:100%;margin:7px 0;padding:10px;border:1px solid #9fb2c0;border-radius:7px;background:#f5f8fa;color:#173746;cursor:pointer;text-align:left}.panel button:hover{background:#e7f3fa}.observation{min-height:4em;padding:11px;background:#edf3f7;border-radius:7px}.status{font-weight:700} @media(max-width:750px){.layout{grid-template-columns:1fr}}@media(prefers-color-scheme:dark){body{background:#111923;color:#eaf0f8}.panel{background:#202a35;border-color:#425668}.panel button{background:#263442;color:#eaf0f8;border-color:#526879}.panel button:hover{background:#32485a}.observation{background:#293747}}
</style>
</head>
<body><main>
<h1>DiagCore : démonstration DHCP</h1>
<p class="intro">Choisis librement tes vérifications. Le moteur est indépendant de C² et des simulateurs. Les observations sont simulées par cette page de test.</p>
<div class="layout">
<div id="diagnostic"></div>
<aside class="panel"><h2>Panneau d’observation</h2>
<p>Effectue les contrôles demandés par le diagnostic :</p>
<button data-action="ip">Effectuer le contrôle IP</button>
<button data-action="server">Contrôler le service DHCP</button>
<button data-action="relay">Contrôler le relais DHCP</button>
<button data-action="fixed">Configurer le relais</button>
<button data-action="retest">Renouveler le bail DHCP</button>
<p id="observations" class="observation" role="status">Aucune vérification effectuée.</p>
<p id="result" class="status" role="status"></p>
<button id="reset-demo">Réinitialiser la démonstration</button>
</aside></div></main>
<script src="../v1/diagcore.js"></script>
<script src="scenario.js"></script>
</body></html>
